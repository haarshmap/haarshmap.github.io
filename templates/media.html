{% extends "base.html" %}

{% block content %}
<style>
  #media-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    transition: opacity 0.2s ease;
  }

  .media-card {
    position: relative;
  }

  .media-poster {
    position: relative;
  }

  .media-image {
    width: 100%;
    display: block;
    aspect-ratio: 2 / 3;
    object-fit: cover;
  }

  .media-title {
    color: #a5a8a6
  }

  .media-rating {
    position: absolute;
    bottom: 8px;
    right: 8px;

    margin: 0;
    padding: 4px 7px;

    background: #282a2e;
    color: #cc6666;

    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  #media-container.filtering {
    opacity: 0;
  }

  @media (max-width: 768px) {
    #media-container {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .media-rating {
      bottom: 6px;
      right: 6px;
      padding: 4px 6px;
      font-size: 0.85rem;
    }

    .tooltip {
      font-size: 0.85rem;
      max-width: 180px;
    }
  }

  @media (max-width: 480px) {
    #media-container {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .media-rating {
      bottom: 5px;
      right: 5px;
      padding: 3px 5px;
      font-size: 0.75rem;
    }

    .tooltip {
      font-size: 0.75rem;
      max-width: 140px;
    }

    .category-buttons {
      gap: 6px;
      flex-wrap: wrap;
    }

    .category-buttons button {
      padding: 6px 10px;
      font-size: 0.8rem;
    }
  }
</style>

<br>
<h1>{{ section.title }}</h1>
<br>

<h2 class="text-accent">stuff i consume or loved</h2>
<br>
<div class="category-buttons">
  <button onclick="filterMedia('all')" class="button-primary">All</button>
  <button onclick="filterMedia('anime')" class="button-primary">Anime</button>
  <button onclick="filterMedia('manga')" class="button-primary">Manga</button>
  <button onclick="filterMedia('games')" class="button-primary">Games</button>
</div>

<template id="media-template">
  <div class="media-card">
    <div class="media-poster">
      <span class="tooltip-wrapper" data-tooltip="">
        <img class="media-image" src="" alt="">
      </span>
      <p class="media-rating"></p>
    </div>
    <p class="media-title"></p>
  </div>
</template>

<br>
<div id="media-container"></div>

  function renderMedia(category = "all") {
    container.replaceChildren();

    media.forEach(item => {
      if (category !== "all" && item.type !== category) {
        return;
      }

      const card = template.content.cloneNode(true);

      card.querySelector(".media-image").src = item.image;
      card.querySelector(".media-image").alt = item.title;
      card.querySelector(".media-title").textContent = item.title;
      card.querySelector(".media-rating").textContent = item.rating;

      card.querySelector(".tooltip-wrapper").setAttribute(
        "data-tooltip",
        item.tooltip
      );

      container.appendChild(card);
    });
  }

  function filterMedia(category) {
    container.classList.add("filtering");

    setTimeout(() => {
      renderMedia(category);
      container.classList.remove("filtering");
    }, 200);
  }

  renderMedia();
</script>
