{% extends "base.html" %}

{% block content %}
<style>
  .gallery {
    display: flex;
    gap: 1rem;
  }

  .gallery-col {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    flex: 1;
    min-width: 0;
  }

  .item {
    display: block;
    width: 100%;
    margin-bottom: 0;
    break-inside: avoid;

  }

  .item img {
    width: 100%;
    height: auto;
  }
</style>
<br>
<h1 class="title">
  {{ section.title }}
</h1>

<br>
<h4>currently on aseprite and just drawing until my next artblock</h4>
<br>
<div class="gallery">
  <div class="gallery-col">

    <span class="tooltip-wrapper" data-tooltip="knockoff yveltal">
      <img src="moltress.png" class="item" alt="gmoltres"></img>
    </span>

    <span class="tooltip-wrapper" data-tooltip="how he moving with tough claws">
      <img src="golissopod(finished).png" class="item" alt="golisopod"></img>
    </span>
  </div>

  <div class="gallery-col">
    <span class="tooltip-wrapper" data-tooltip="just another antenna modeller">
      <a href="https://github.com/karthik20066002/jaam"><img src="Jaam.png" class="item" alt="jaam"></a>
    </span>

    <span class="tooltip-wrapper" data-tooltip="the best button">
      <img src="pearto_button.png" class="item" alt="pearto"></img>
    </span>
  </div>
</div>
{% endblock content %}
